services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: youtube
      POSTGRES_USER: youtube
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run deploy.sh to generate .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U youtube -d youtube"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-55Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Run deploy.sh to generate .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Run deploy.sh to generate .env}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://youtube:${DB_PASSWORD:?Run deploy.sh to generate .env}@db:5432/youtube
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Run deploy.sh to generate .env}
      S3_SECRET_KEY: ${MINIO_SECRET_KEY:?Run deploy.sh to generate .env}
      JWT_SECRET: ${JWT_SECRET:?Run deploy.sh to generate .env}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  seed:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "seed.py"]
    environment:
      DATABASE_URL: postgresql://youtube:${DB_PASSWORD:?Run deploy.sh to generate .env}@db:5432/youtube
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Run deploy.sh to generate .env}
      S3_SECRET_KEY: ${MINIO_SECRET_KEY:?Run deploy.sh to generate .env}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
